- 사건 연결, Action 생성, 법적 판단, 상태 변경, DB 쓰기는 하지 않는다.
- 결과에는 각 값의 근거 문구와 원본 위치를 붙이고, 불명확한 값은 null 또는 후보 목록으로 남긴다.
- 개인정보와 메일 본문은 작업에 필요한 범위만 반환한다.
"""
